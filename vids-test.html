<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Vids embed test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f6f8; color: #16243a; }
  h1 { font-size: 1.4rem; }
  p { max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; }
  .box { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 12px; }
  .box h2 { font-size: 1rem; margin: 0 0 8px; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #16243a; border-radius: 6px; overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <h1>Google Vids embed test (temporary, do not commit)</h1>
  <p>Each box tries a different way of embedding your video. Tell Claude which letter, if any, shows the video and lets you play it. Boxes that are blank or say "refused to connect" don't work.</p>
  <div class="grid">
    <div class="box"><h2>A: /preview</h2><div class="frame"><iframe src="https://docs.google.com/videos/d/1VpWSdU9sdAKXg0YwIFp2UEbqOTzmvlh9WUbbdgnf_ak/preview" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
    <div class="box"><h2>B: /embed</h2><div class="frame"><iframe src="https://docs.google.com/videos/d/1VpWSdU9sdAKXg0YwIFp2UEbqOTzmvlh9WUbbdgnf_ak/embed" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
    <div class="box"><h2>C: /play (the link you shared)</h2><div class="frame"><iframe src="https://docs.google.com/videos/d/1VpWSdU9sdAKXg0YwIFp2UEbqOTzmvlh9WUbbdgnf_ak/play" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
  </div>
</body>
</html>
